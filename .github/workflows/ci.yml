name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend — migrations, tests, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend (with dev extras)
        run: python -m pip install -c requirements.lock -e ".[dev]"

      - name: Run database migrations
        env:
          MRTL_DATABASE_URL: sqlite:///./data/db/ci.sqlite
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Ruff (lint)
        run: python -m ruff check .

      - name: Pytest (coverage gate ≥ 85%)
        run: python -m pytest

  reference-model:
    name: Optional CPU Transformer — training smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend and CPU reference model
        run: |
          python -m pip install -c requirements.lock -e ".[dev]"
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Test all reference-model variants
        run: |
          python -c "import torch; print(torch.__version__)"
          python -m pytest -o addopts="" -q tests/test_reference_transformer.py

  frontend:
    name: Frontend — typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E — golden path (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: python -m pip install -c requirements.lock -e ".[dev]"

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run golden-path E2E
        working-directory: frontend
        env:
          MRTL_PYTHON: python
        run: npm run e2e


      - name: Attach cockpit screenshots for review
        if: github.event_name == 'pull_request' && success()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-screenshots
          path: |
            frontend/test-results/design-*/*.png
            frontend/test-results/studies-*/*.png
          if-no-files-found: error
          retention-days: 14
