[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketgpt-blind-replay-backend"
version = "0.1.0"
description = "Local-only educational replay benchmark foundation (FastAPI)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typing-extensions>=4.10",  # typing_extensions.Self for Python 3.10
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pandas>=2.2",
    "python-multipart>=0.0.9",  # required by POST /api/market/upload (Phase 1)
]

[project.optional-dependencies]
# F1 download only (python -m src.data.download); never needed by tests or CI.
data = [
    "yfinance>=0.2.48",       # multi_level_index= keyword used by the source adapter
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",            # required by fastapi.testclient.TestClient
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
include = ["src*"]

# --- Formatting -------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py310"]

# --- Linting ----------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"
# Alembic migration scripts are autogenerated; don't lint their long
# op.create_table lines.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes, I: isort, B: bugbear, UP: pyupgrade,
# N: pep8-naming, SIM: flake8-simplify.
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
# The formatter wraps code; authored lessons, formulas and error strings stay
# readable as paragraphs without manually splitting every French sentence.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]

[tool.ruff.lint.per-file-ignores]
# W1 teaching scripts keep standard matrix notation (X, W, dW1) on purpose.
"learning/**" = ["N803", "N806"]

# --- Testing ----------------------------------------------------------------
[tool.pytest.ini_options]
# Run pytest from the backend/ directory; "." puts the `src` package on
# the import path without an editable install being strictly required.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["src"]

# --- Type checking (optional in V1, strict recommended) ---------------------
[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
